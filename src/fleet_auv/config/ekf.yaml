# robot_localization EKF for the knucker (REP-105: publishes odom -> base_link). Inputs are the sensor drivers' topics.
# Frames: odom origin is the spawn point horizontally and the water surface vertically (depth_pose z = -depth).
# The DVL is FRD, so its twist is rotated into base_link by the TF tree (dvl_link has roll pi).
