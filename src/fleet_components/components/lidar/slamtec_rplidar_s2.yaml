model: Slamtec RPLIDAR S2
category: lidar
vendor: Slamtec
datasheet: https://www.slamtec.com/en/s2
sources:
  - {url: https://www.waveshare.com/wiki/RPLIDAR_S2, used_for: "specifications table (the official manual is not downloadable by script); mass 185 g"}
  - {url: https://www.coreelectronics.com.au/, used_for: "mass 190 g (retailer), kept as the alternative"}
  - {url: https://github.com/Slamtec/sllidar_ros2, used_for: "driver node source: topic, QoS, binning, range_min, REP-117"}
specs:
  range_min: 0.05                       # m
  range_max_white: 30.0                 # m @ 90 % reflectivity
  range_max_black: 10.0                 # m @ 10 % reflectivity
  sample_rate: 32000                    # samples/s (32 kHz)
  scan_rate_hz: 10.0
  angular_resolution_deg: 0.1125
  accuracy: 0.030                       # m "+-30 mm" (no statistical definition published)
  resolution: 0.013                     # m
  mass: 0.185                           # kg (Waveshare); 190 g at Core Electronics
  # outline unpublished in the sources read (Waveshare wiki and slamtec.com/en/s2 only give 18 mm optical area height).
  # size_estimate: C1 density (0.110 kg / (55.6 x 55.6 x 41.3 mm) = 861 kg/m3) at the S2 mass, C1 proportions: scale (0.185/0.110)^(1/3) = 1.189.
  # Only used for the sensor link inertia (~1e-4 kg m^2); replace with the drawing in the S2 manual.
  size_estimate: [0.0661, 0.0661, 0.0491]   # m ESTIMATE, not a datasheet value
  ingress: IP65
  baudrate: 1000000
ros_driver:
  package: sllidar_ros2
  node: sllidar_node
  parameters: {scan_mode: DenseBoost, angle_compensate: true, frame_id: laser_frame, serial_baudrate: 1000000}
  topics: {scan: sensor_msgs/msg/LaserScan}
  frame_id: laser_frame
  rate_hz: 10
  qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}
sim:
  gz_sensor: gpu_lidar
  samples_per_rev: 3200                 # = sample_rate / scan_rate_hz
  update_rate: 10
  range_min: 0.05
  range_max: 30.0
  range_noise_stddev: 0.010             # m; ASSUMPTION: +-30 mm read as 3 sigma
  range_quantisation: 0.00025
  output_bins: 3240                     # multiple = int(3200/360 + 1) = 9 -> 360 * 9
  angle_compensate_multiple: 9
limitations: >-
  As the C1: +-30 mm accuracy taken as 3 sigma, reflectivity-dependent range not modelled (30 m is the
  90 % target value), intensities zero, no motion distortion. The official S2 manual could not be
  fetched; the DenseBoost scan-mode numbers come from the Waveshare wiki table.
