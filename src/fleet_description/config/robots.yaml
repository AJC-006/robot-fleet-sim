# Single source of truth for the robots (see docs/ARCHITECTURE.md for the wheeled schema; the legged
# schema is described above the first `kind: legged` entry below).
# Read by: xacro (urdf/robot.urdf.xacro), blender/build_robots.py, fleet_bringup launch.
# body.*  : free-form, used by Blender and the xacro:
#   wheel_style           wheel mesh generator (blender/robots/parts.py)
#   com, inertia_box      LEGGED ONLY: centre and outer size of the body shell box (budget input)
#   (wheeled robots: mass, CoM and inertia come from config/mass_properties.yaml, see tools/mass_properties.py)
#   (wheel friction: sim.mu of the `tyre` component in the catalog, applied by urdf/wheel.xacro; DART takes min(tyre, floor) per
#                         contact, so the floor's cited rubber/floor pair value governs where it is lower;
#                         the CoulombFriction world plugin turns DART's box into a cone). docs/notes/ground.md G2
#   collisions            primitives in the base_link frame (z up from the axle, ground = -wheel_radius)
# lidar/imu/camera x,y,z are in base_footprint (z above ground); which product sits there is `components:`.
# components.<role>: file stem of the catalog entry. Roles: lidar (category lidar), imu (imu), camera
#   (depth_camera), wheel_motor (dc_motor), motor_driver, battery_cell (battery), tyre | joint_actuators
#   {coxa, femur, tibia} (servo). battery_pack {series, parallel}. mounts: see each robot.

round:
  label: "Pebble (round)"
  # components: catalog entries (src/fleet_components/components/<category>/<name>.yaml) picked by file
  # stem; swapping a sensor or motor means changing one name here. Masses, inertia and CoM are an OUTPUT of
  # tools/mass_properties.py (config/mass_properties.yaml), not inputs.
  components:
    lidar: slamtec_rplidar_c1
    imu: microstrain_3dm_cv7_ahrs
    camera: intel_realsense_d435
    wheel_motor: pololu_37d_12v_50to1_64cpr
    motor_driver: basicmicro_roboclaw_2x15a
    battery_cell: samsung_inr18650_35e
    tyre: rubber_on_concrete
  battery_pack: {series: 3, parallel: 1}
  # base_link-frame positions (m) of the pack and of the first driver (further drivers every 0.08 m along x):
  # layout choices of this model, the CoM follows
  mounts: {battery: [0.0, 0.0, 0.02], driver: [-0.06, 0.0, 0.045]}
  wheel_radius: 0.035
  wheel_width: 0.022
  wheel_separation: 0.23
  # source: G2 bench (docs/notes/ground.md): sphere tyre contact + CoulombFriction gives yaw ratio
  # 1.000 at the geometric wheel_separation (the old 0.9/0.86 compensated cylinder-contact artefacts)
  wheel_separation_multiplier: 1.0
  left_wheels: [left_wheel]
  right_wheels: [right_wheel]
  wheel_x: [0.0]
  casters:
    - {name: front, x: 0.10, y: 0.0, radius: 0.015}
    - {name: rear, x: -0.10, y: 0.0, radius: 0.015}
  body:
    wheel_style: pebble
    # source: Engineering ToolBox, friction coefficients, "Tire, dry / Road, dry" 1.0 and "Rubber / Dry
    # Asphalt" static 0.9 (engineeringtoolbox.com/friction-coefficients-d_778.html): upper bound of the
    # tyre/floor pairs; floors carry their own lower pair values. G3/G5 replace it with the tyre product.
    collisions:
      - {shape: cylinder, radius: 0.14, length: 0.075, xyz: [0.0, 0.0, 0.0275]}
  lidar: {x: 0.0, y: 0.0, z: 0.17}
  imu: {x: 0.0, y: 0.0, z: 0.06}
  camera: {x: 0.143, y: 0.0, z: 0.075, pitch: 0.0}
  footprint: [[0.158, 0.058], [0.063, 0.153], [-0.063, 0.153], [-0.153, 0.063], [-0.153, -0.063], [-0.063, -0.153], [0.063, -0.153], [0.158, -0.058]]
  robot_radius: 0.158
  max_vel_x: 0.5
  max_vel_theta: 2.0
  height: 0.19

