# ---------------------------------------------------------------------------------------------------
# Legged robots (kind: legged). Kinematics: src/fleet_legged/fleet_legged/kinematics.py.
#   leg_type        yaw  = sprawling leg, coxa axis z rotated by the leg's mount_yaw_deg (wyrm, spider)
#                   roll = mammal leg, coxa axis x (hip ab/ad), femur joint `coxa` metres to the side (hound)
#   knee            +1 knee up (q_tibia > 0), -1 knee back (q_tibia < 0)
#   standing_height base_link height above the floor while standing (base_footprint -> base_link z)
#   crouch_height   body height at spawn; the gait node raises it to standing_height
#   link            coxa/femur/tibia lengths, foot_radius (foot sphere centre at the tibia end) and
#                   *_radius of the collision/inertia cylinders
#   (link masses, CoM and inertia: config/mass_properties.yaml, from the servo catalog entries + structure)
#   joint           effort (N m, also the Gazebo servo force limit), velocity (rad/s), damping, friction
#   limits          [lo, hi] rad per joint type; roll-leg coxa limits are mirrored on the right side
#   legs            name, hip [x,y,z] in base_link, mount_yaw_deg (yaw legs), foot [x,y] nominal stance
#   gait            type (trot | creep | wave | tetrapod), period s, duty (stance fraction), step_height m,
#                   offsets (phase per leg, same order as legs), max_reach (m, swing-target clamp),
#                   odom_scale [sx, sy] leg-odometry calibration (Gazebo ground truth / leg odometry from
#                   walk_test.py; the round feet roll and slip, so the raw stance-foot fit reads short)
#   body            com, inertia_box, collisions (box | cylinder | sphere, optional rpy; base_link frame,
#                   z = 0 at the body centre, floor at -standing_height), foot_mu (isotropic, same convention as the tyre mu)
#   lidar/imu/camera x,y,z with z above the floor while standing
#   footprint       swept stance envelope (feet at max speed + body/head/tail) + 1 cm, in base_footprint
#                   (ros2 run fleet_legged envelope.py <robot> prints it)

wyrm:
  label: "Wyrm (dragon hatchling)"
  components:
    lidar: slamtec_rplidar_c1
    imu: microstrain_3dm_cv7_ahrs
    camera: intel_realsense_d435
    joint_actuators: {coxa: robotis_xm430_w210, femur: robotis_xh540_w150, tibia: robotis_xm430_w210}
    battery_cell: samsung_inr18650_35e
  battery_pack: {series: 3, parallel: 2}
  # base_link-frame position of the pack (layout choice of this model)
  mounts: {battery: [0.0, 0.0, -0.01]}
  kind: legged
  leg_type: yaw
  knee: 1
  standing_height: 0.14
  crouch_height: 0.09
  link: {coxa: 0.035, femur: 0.10, tibia: 0.115, foot_radius: 0.018, coxa_radius: 0.022, femur_radius: 0.018, tibia_radius: 0.013}
  joint: {effort: 6.0, velocity: 16.0, damping: 0.02, friction: 0.0}
  limits:
    coxa: [-0.75, 0.75]
    femur: [-1.3, 1.0]
    tibia: [0.2, 2.6]
  legs:
    - {name: lf, hip: [0.11, 0.06, -0.01], mount_yaw_deg: 57, foot: [0.19, 0.185]}
    - {name: rf, hip: [0.11, -0.06, -0.01], mount_yaw_deg: -57, foot: [0.19, -0.185]}
    - {name: lh, hip: [-0.11, 0.06, -0.01], mount_yaw_deg: 123, foot: [-0.19, 0.185]}
    - {name: rh, hip: [-0.11, -0.06, -0.01], mount_yaw_deg: -123, foot: [-0.19, -0.185]}
  gait: {type: trot, period: 0.6, duty: 0.6, step_height: 0.035, offsets: [0.0, 0.5, 0.5, 0.0], max_reach: 0.05,
         odom_scale: [1.03, 1.03]}
  body:
    com: [0.0, 0.0, 0.0]
    inertia_box: [0.36, 0.14, 0.09]
    # base_link xy hull of the visual (head, snout, body, folded wings, tail curled to the right) + 5 mm,
    # added to the footprint
    outline: [[0.327, 0.0], [0.318, 0.019], [0.253, 0.059], [0.16, 0.068], [0.057, 0.075], [-0.146, 0.078], [-0.287, 0.019], [-0.334, -0.016], [-0.358, -0.07], [-0.351, -0.122], [-0.329, -0.152], [-0.299, -0.167], [0.253, -0.059], [0.308, -0.026]]
    # source: as the tyre mu (rubber foot cap; upper bound of the rubber/floor pairs, floors govern)
    foot_mu: 1.0
    collisions:
      - {shape: box, size: [0.30, 0.13, 0.075], xyz: [-0.01, 0.0, 0.005]}
      - {shape: sphere, radius: 0.045, xyz: [0.215, 0.0, 0.03]}
  lidar: {x: -0.03, y: 0.0, z: 0.27}
  imu: {x: 0.0, y: 0.0, z: 0.14}
  camera: {x: 0.27, y: 0.0, z: 0.19, pitch: 0.15}
  footprint: [[-0.361, -0.126], [-0.336, -0.159], [-0.238, -0.225], [-0.174, -0.249], [0.168, -0.255], [0.252, -0.226], [0.338, 0.000], [0.246, 0.222], [0.174, 0.249], [-0.168, 0.254], [-0.258, 0.224], [-0.368, -0.069]]
  robot_radius: 0.382
  max_vel_x: 0.18
  max_vel_y: 0.08
  max_vel_theta: 0.6
  height: 0.30

