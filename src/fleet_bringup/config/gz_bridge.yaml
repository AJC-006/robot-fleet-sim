# Raw Gazebo sensor topics, bridged under /gz/. The driver-accurate topics (scan, imu/data, imu/data_raw,
# camera/camera/...) are produced from these by fleet_sensor_sim (started by sim.launch.py).
# The camera topics are added by sim.launch.py when camera:=true.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /gz/scan
  gz_topic_name: /gz/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /gz/imu
  gz_topic_name: /gz/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
