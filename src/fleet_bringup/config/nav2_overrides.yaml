# Deep-merged by sim.launch.py over the installed nav2_bringup/params/nav2_params.yaml, so every
# parameter the installed Nav2 expects is present and only what differs is listed here. After the
# merge the launch also fills in, per robot and world:
#   - footprint polygon (both costmaps), inflation radius
#   - the robot kind's motion model and speed limits (MPPI motion_model/vx/vy/wz, velocity_smoother,
#     behavior_server, AMCL robot_model_type): see the KINDS functions in sim.launch.py
#   - AMCL initial pose = the world's spawn pose
#   - enable_stamped_cmd_vel: true and odom_topic: /odometry/filtered on every node that has them
amcl:
  ros__parameters:
    base_frame_id: base_footprint
    set_initial_pose: true
    laser_max_range: 20.0
    max_particles: 2000
    min_particles: 300

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    FollowPath:
      # Lighter than the default 2000 so Gazebo, RViz and Nav2 fit on 8 laptop threads.
      batch_size: 1000
      visualize: false
      # The default temperature 0.3 averages the samples so much that the robot never gets past
      # ~0.15 m/s of its 0.5 m/s limit; a sharper softmax and wider speed noise fix that.
      temperature: 0.05
      vx_std: 0.3
      CostCritic:
        # The costmaps use the robot's footprint polygon, so the critic must check it too
        # (otherwise MPPI warns "Inconsistent configuration in collision checking").
        consider_footprint: true

local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      # Default 0.3 s. On a loaded laptop the EKF/AMCL transforms can lag the scans by ~0.6 s of sim
      # time; MPPI then aborts with "Transform data too old when converting from map to odom", and a
      # TF error is not one the default BT recovers from, so the whole goal fails.
      transform_tolerance: 1.0
      width: 4
      height: 4
      resolution: 0.05
      voxel_layer:
        scan: {raytrace_max_range: 20.0, obstacle_max_range: 19.5}

global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      transform_tolerance: 1.0
      # `resolution` is replaced by the map's own resolution in sim.launch.py (0.05 or 0.10 m/px);
      # the local costmap always stays at 0.05.
      obstacle_layer:
        scan: {raytrace_max_range: 20.0, obstacle_max_range: 19.5}

# Large maps: Smac 2D A* (the NavFn default is Dijkstra over the whole grid, too slow at 300x220 m).
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 4.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

slam_toolbox:
  ros__parameters:
    max_laser_range: 20.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
